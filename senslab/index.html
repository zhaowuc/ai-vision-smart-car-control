<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SensLab Personal 1.1.0 · 单次灵敏度比较</title><style>body{margin:0;background:#0d1013;color:#edf2f1;font:16px/1.8 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{max-width:620px;padding:42px}small{color:#91a59b;letter-spacing:.18em}h1{font-size:36px;line-height:1.3}p{color:#a5b2ad}a{color:#b5e8ca}button{padding:12px 24px;border:0;border-radius:10px;background:#c7f6da;color:#14271b;font:inherit;cursor:pointer}#error{white-space:pre-wrap;color:#f2c79f}.bar{height:3px;background:#c7f6da;border-radius:2px;width:100%;margin:28px 0}</style></head><body><main><small>PERSONAL AIM RESEARCH / 1.1.0</small><h1>SensLab Personal</h1><p id="status">正在载入并校验单次灵敏度比较程序。</p><div class="bar"></div><p>无需账号。记录保存在当前浏览器，请定期导出 JSON 备份。正式测试请使用独立的桌面 Chrome 或 Edge 标签页。</p><pre id="error"></pre><button id="retry" hidden onclick="location.reload()">重新载入</button><p><a href="SensLab-Personal.html">打开完整离线版</a> · <a href="README.md">源码与运行说明</a></p><noscript>需要启用 JavaScript 才能执行测试。</noscript></main><script>
(async()=>{
 const expected='2cbe8af95ea48272fd66bc7b790fc61a7a39a8223b7c9e62b2aa941ca75d5d55';
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);
 try{
  if(!window.DecompressionStream||!window.crypto?.subtle)throw new Error('浏览器缺少安全解压或校验功能。请使用 HTTPS / localhost 地址与近期桌面 Chrome 或 Edge，或打开完整离线 HTML。');
  const chunks=await Promise.all(Array.from({length:8},async(_,i)=>{
   const name='app-'+String(i+1).padStart(2,'0')+'.bin';
   const response=await fetch(new URL(name,location.href),{signal:controller.signal,credentials:'omit',cache:'no-store'});
   if(!response.ok)throw new Error(name+' 载入失败：HTTP '+response.status);
   return new Uint8Array(await response.arrayBuffer());
  }));
  const packed=new Uint8Array(chunks.reduce((n,a)=>n+a.length,0));let offset=0;
  for(const chunk of chunks){packed.set(chunk,offset);offset+=chunk.length;}
  const bytes=await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const digest=await crypto.subtle.digest('SHA-256',bytes);
  const actual=Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('');
  if(actual!==expected)throw new Error('完整程序 SHA-256 校验失败，未执行测试。请重新载入或使用完整离线版。');
  const html=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  clearTimeout(timeout);document.open();document.write(html);document.close();
 }catch(error){
  controller.abort();clearTimeout(timeout);
  document.getElementById('status').textContent='未能完成载入，未执行测试。';
  document.getElementById('error').textContent=error.name==='AbortError'?'网络超时，可重新载入或使用完整离线 HTML。':String(error.message||error);
  document.getElementById('retry').hidden=false;
 }
})();
</script></body></html>
