[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

lib_deps =
  links2004/WebSockets@^2.4.0
  bblanchon/ArduinoJson@^6.21.5
  adafruit/Adafruit SSD1306@^2.5.7
  adafruit/Adafruit GFX Library@^1.11.9